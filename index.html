<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Documentos | REA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">REA</div>
    <div>
        <h1>Gerador de Documentos</h1>
        <p>Registro Empresarial Abinadólar</p>
    </div>
</header>

<main>

    <section class="card">
        <h2>Preparar documento</h2>
        <p class="description">
            Cole abaixo o pacote JSON fornecido pelo REA.
        </p>

        <textarea
            id="jsonInput"
            placeholder="Cole o JSON do documento aqui..."
            spellcheck="false"
        ></textarea>

        <button id="generateButton">
            Gerar documento
        </button>

        <div id="status"></div>
    </section>

    <section id="documentInfo" class="card hidden">
        <h2>Documento identificado</h2>

        <div class="info-grid">
            <div>
                <span>Tipo</span>
                <strong id="infoType">-</strong>
            </div>

            <div>
                <span>PEA</span>
                <strong id="infoProtocol">-</strong>
            </div>

            <div>
                <span>Serviço</span>
                <strong id="infoService">-</strong>
            </div>

            <div>
                <span>NREA</span>
                <strong id="infoNrea">-</strong>
            </div>
        </div>
    </section>

</main>

<footer>
    REA • Registro Empresarial Abinadólar
</footer>

<script src="https://unpkg.com/pizzip/dist/pizzip.min.js"></script>
<script src="https://unpkg.com/docxtemplater/build/docxtemplater.js"></script>

<script src="script.js"></script>

</body>
</html>
